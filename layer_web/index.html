<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1814" />
  <title>LAYER</title>
  <link rel="stylesheet" href="styles.css?v=8" />
  <script src="catalog.js"></script>
</head>
<body class="wx-hot">
  <div class="sky" aria-hidden="true"></div>
  <div id="app">
    <section id="screen-auth" class="screen">
      <div class="center-pad">
        <h1 class="logo">LAYER</h1>
        <p class="sub">Perfume layering</p>
        <input id="auth-email" type="email" placeholder="Email" />
        <input id="auth-phone" type="tel" placeholder="Phone" />
        <button class="btn primary" onclick="doAuth()">Create account</button>
        <div class="or">or</div>
        <button class="btn outline" onclick="doAuth('google')">Continue with Google</button>
        <button class="btn outline" onclick="doAuth('apple')">Continue with Apple</button>
        <button class="btn outline" onclick="doAuth('yahoo')">Continue with Yahoo</button>
      </div>
    </section>
    <section id="screen-prefs" class="screen hidden">
      <header class="top">What do you like?</header>
      <p class="pad-side muted">Pick notes & accords</p>
      <div id="pref-chips" class="chips"></div>
      <div class="bottom-bar"><button class="btn primary" id="prefs-continue" disabled onclick="savePrefs()">Continue</button></div>
    </section>
    <section id="screen-shell" class="screen hidden">
      <div id="page-home" class="page">
        <div class="home-wrap">
          <div class="status-row"><span id="clock">9:41</span></div>
          <p class="greet" id="home-greet">Good evening</p>
          <h1 class="headline">How do you want<br>to feel today?</h1>
          <div class="glass hero">
            <p class="hero-prompt" id="weather-line">Reading the sky…</p>
          </div>
          <div class="vibe-row" id="vibe-row"></div>
          <h3 class="section-h">Layer of the day</h3>
          <div id="layer-cards"></div>
          <span id="home-weather" class="hidden"></span>
          <span id="home-hint" class="hidden"></span>
          <button id="wear-btn" class="hidden"></button>
        </div>
      </div>
      <div id="page-collection" class="page hidden">
        <header class="top">My Collection</header>
        <div class="pad">
          <p class="muted" id="owned-count">0 owned</p>
          <div id="owned-list"></div>
          <button class="btn primary" onclick="openBrandIndex()">+ Add perfume</button>
        </div>
      </div>
      <div id="page-profile" class="page hidden">
        <header class="top">Profile</header>
        <div class="pad profile">
          <div class="avatar">L</div>
          <p id="profile-email" class="center"></p>
          <div class="card">
            <div class="row-between"><span>Weather</span><span id="profile-weather"></span></div>
            <div class="row-between"><span>Liked notes</span><span id="profile-likes"></span></div>
            <div class="row-between"><span>Owned</span><span id="profile-owned"></span></div>
          </div>
          <button class="btn outline" onclick="resetAll()">Reset (dev)</button>
        </div>
      </div>
      <nav class="tabbar">
        <button class="tab active" data-page="home" onclick="goPage('home')">Home</button>
        <button class="tab" data-page="collection" onclick="goPage('collection')">My Collection</button>
        <button class="tab" data-page="profile" onclick="goPage('profile')">Profile</button>
      </nav>
    </section>
    <section id="screen-brands" class="screen hidden">
      <header class="top"><button class="back" onclick="closeToCollection()">←</button><span>Brands A–Z</span></header>
      <div id="letter-bar" class="letter-bar"></div><div id="brand-list"></div>
    </section>
    <section id="screen-brand-bottles" class="screen hidden">
      <header class="top"><button class="back" onclick="openBrandIndex()">←</button><span id="brand-title">Brand</span></header>
      <div id="brand-bottles" class="pad"></div>
    </section>
    <section id="screen-detail" class="screen hidden">
      <header class="top"><button class="back" onclick="backFromDetail()">←</button><span id="detail-title">Bottle</span></header>
      <div class="pad" id="detail-body"></div>
    </section>
  </div>
  <div id="toast" class="toast hidden"></div>
  <script src="app.js?v=8"></script>
  <script src="weather.js?v=8"></script>
  <script src="ui-home.js?v=8"></script>
</body>
</html>
